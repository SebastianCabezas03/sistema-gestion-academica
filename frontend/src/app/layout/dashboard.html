<div class="app-shell" [class.menu-collapsed]="menuCollapsed">
  <aside class="sidebar">
    <a routerLink="/inicio" class="brand">
      <span class="brand-icon">G</span>
      <span>
        <strong>Gestión</strong>
        <small>ACADÉMICA</small>
      </span>
    </a>

    <div class="menu-label">MENÚ PRINCIPAL</div>

    <nav class="navigation">
      <a *ngIf="rol === 'ADMIN'"
        routerLink="/inicio"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }">
        <span class="nav-icon">⌂</span>
        Inicio
      </a>

      <a *ngIf="rol === 'ADMIN'"
        routerLink="/alumnos"
        routerLinkActive="active">
        <span class="nav-icon">♙</span>
        Alumnos
      </a>

      <a routerLink="/cursos" routerLinkActive="active">
        <span class="nav-icon">▤</span>
        Cursos
      </a>

      <a *ngIf="rol === 'ADMIN'"
        routerLink="/docentes"
        routerLinkActive="active">
        <span class="nav-icon">♧</span>
        Docentes
      </a>

      <a *ngIf="rol === 'ADMIN'"
        routerLink="/matriculas"
        routerLinkActive="active">
        <span class="nav-icon">▣</span>
        Matrículas
      </a>

      <a *ngIf="rol === 'ADMIN'"
        routerLink="/cuentas"
        routerLinkActive="active">
        <span class="nav-icon">🔐</span>
        Cuentas
      </a>

      <a routerLink="/mi-perfil" routerLinkActive="active">
        <span class="nav-icon">♙</span>
        Mi perfil
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="profile-avatar">{{ iniciales }}</div>
      <div>
        <strong>{{ usuario }}</strong>
        <small>{{ nombreRol }}</small>
      </div>
    </div>

    <button type="button" class="btn-logout" (click)="cerrarSesion()">
      Cerrar sesión
    </button>
  </aside>

  <main class="main-area">
    <header class="topbar">
      <button
        class="menu-toggle"
        type="button"
        (click)="toggleMenu()"
        [attr.aria-expanded]="!menuCollapsed"
        aria-label="Contraer o expandir el menú">
        ☰
      </button>

      <div>
        <span class="topbar-label">PLATAFORMA ACADÉMICA</span>
        <strong>{{ nombreRol }}</strong>
      </div>

      <div class="status">
        <span class="status-dot"></span>
        Sistema activo
      </div>
    </header>

    <section class="page-content">
      <router-outlet />
    </section>
  </main>
</div>
